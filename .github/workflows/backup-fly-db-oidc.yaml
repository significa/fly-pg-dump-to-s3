name: Backup fly DB (OIDC)

on:
  workflow_call:
    inputs:
      fly-db-name:
        description: >-
          The Fly app name of your db. Example: `my-fly-app`.
        required: true
        type: string
      fly-proxy-remote-host:
        description: >-
          Optional `remote_host` passed to `flyctl proxy`, to pin the connection to a specific
          machine instead of letting Fly pick one.
          Example: `fa2a:c:ef16:a7b:4e6:a667:32d9:1`
          For more info refer to https://fly.io/docs/flyctl/proxy/
        required: false
        default: ''
        type: string
      timeout:
        description: Backup GitHub action step timeout, in minutes.
        required: false
        type: number
      action-ref:
        description: >-
          The `ref` to clone the trigger backup script from. Allows to override GitHub's context
          `github.action_ref` when it does not behave properly.
        required: false
        default: ${{ github.action_ref }}
        type: string
      postgres_version:
        description: >-
          Postgres docker image tag for pg_dump version.
          See tags available in https://hub.docker.com/_/postgres
        required: false
        default: '17-alpine'
        type: string

    secrets:
      FLY_API_TOKEN:
        required: true
      DATABASE_URL:
        description:  >-
          The URL used to connect and dump the database. Since we are using `flyctl proxy` it is 
          expected an URL with host localhost and port 5432.
          Example: `postgresql://username:password@localhost:5432/my-db-name`
        required: true
      S3_DESTINATION_URL:
        description: >-
          The AWS S3 compatible backup target.
          Example: `s3://bucket/backup.sql`
        required: true
      AWS_ROLE_ARN:
        description: 'AWS IAM role ARN for assuming deployment permissions'
        required: true

permissions:
  id-token: write # Required for OIDC

jobs:
  backup_db:
    name: Perform database backups
    runs-on: ubuntu-latest
    concurrency: ${{ github.workflow }}-fly-db-backup
    timeout-minutes: ${{ inputs.timeout }}
    env:
      PROXY_LOG_FILE: /tmp/flyctl-proxy.log
      PROXY_READY_TIMEOUT: '20'
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1 # us-east-1 is required for OIDC token exchange
          disable-retry: true

      - uses: actions/checkout@v7
        with:
          repository: significa/fly-pg-dump-to-s3
          path: ./fly-pg-dump-to-s3
          ref: ${{ inputs.action-ref }}

      # Fails early and loudly if the token cannot see the app, instead of later with an
      # opaque "connection refused" from pg_dump.
      - name: Check the Fly token can reach the app
        shell: bash
        run: flyctl machines list -a "$FLY_DB_NAME"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          FLY_DB_NAME: ${{ inputs.fly-db-name }}

      - name: Pull the postgres image
        run: docker pull --quiet postgres:${{ inputs.postgres_version }}

      - name: Start the Fly proxy
        shell: bash
        run: |
          # `remote_host` is optional, it is only passed as an argument when set.
          # Output goes to the step log and to a file, so a later step can show it on failure.
          flyctl proxy 5432:5432 ${FLY_PROXY_REMOTE_HOST:+"$FLY_PROXY_REMOTE_HOST"} \
            -a "$FLY_DB_NAME" 2>&1 | tee "$PROXY_LOG_FILE" &
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          FLY_DB_NAME: ${{ inputs.fly-db-name }}
          FLY_PROXY_REMOTE_HOST: ${{ inputs.fly-proxy-remote-host }}

      - name: Wait for the database to accept connections
        shell: bash
        run: |
          echo "Waiting up to ${PROXY_READY_TIMEOUT}s for localhost:5432"

          if timeout "$PROXY_READY_TIMEOUT" bash -c '
            until docker run --rm --network host \
              postgres:${{ inputs.postgres_version }} \
              pg_isready --host=localhost --port=5432
            do
              sleep 1
            done
          '; then
            echo "The database is accepting connections."
            exit 0
          fi

          echo "::error::The database did not accept connections within ${PROXY_READY_TIMEOUT}s."

          echo "--- Last pg_isready attempt"
          docker run --rm --network host \
            postgres:${{ inputs.postgres_version }} \
            pg_isready --host=localhost --port=5432 || true

          echo "--- flyctl proxy output ($PROXY_LOG_FILE)"
          cat "$PROXY_LOG_FILE" || echo "No proxy log file was written."

          exit 1

      - name: Run backups
        shell: bash
        run: |
          export PG_DUMP_PATH="docker run --rm --network host \
            -u $(id -u):$(id -g) \
            -e BACKUPS_TEMP_DIR=/tmp/db-backups \
            -v /tmp/db-backups:/tmp/db-backups \
            postgres:${{ inputs.postgres_version }} pg_dump"

          echo "Using PG_DUMP_PATH=$PG_DUMP_PATH"

          ./fly-pg-dump-to-s3/pg-dump-to-s3.sh '${{ secrets.DATABASE_URL }}' '${{ secrets.S3_DESTINATION_URL }}'

      - name: Show the Fly proxy output
        if: failure()
        run: cat "$PROXY_LOG_FILE" || echo "No proxy log file was written."
