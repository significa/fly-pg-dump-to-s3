primary_region = "lhr"
kill_signal = "SIGINT"
kill_timeout = 10

[build]
  image = "ghcr.io/significa/fly-pg-dump-to-s3"

[[mounts]]
  destination = "/tmp/db-backups"
  source = "temp_data"

# SETUP THIS FOR YOUR ROLE
# [env]
#   AWS_ROLE_ARN = "arn:aws:iam::<account-id>:role/<role-name>"
#   AWS_REGION = "eu-central-1"
